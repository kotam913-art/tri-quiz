<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b72">
  <title>プリント類題｜Math Link</title>
  <link rel="stylesheet" href="generated-quiz.css?v=1">
</head>
<body>
  <header class="topbar">
    <a href="index.html">← クイズ一覧</a>
    <span>Math Link</span>
  </header>
  <main>
    <section id="loading" class="state" aria-live="polite">類題を読み込んでいます…</section>
    <section id="error" class="state error" hidden>
      <h1>類題を開けませんでした</h1>
      <p>URLを確認して、クイズ一覧からもう一度開いてください。</p>
    </section>
    <article id="quiz" hidden>
      <header class="quiz-header">
        <p id="quiz-kicker" class="kicker"></p>
        <h1 id="quiz-title"></h1>
        <p id="quiz-summary" class="summary"></p>
        <div id="quiz-tags" class="tags"></div>
        <a id="pdf-link" class="pdf-link" hidden>ロイロ用PDFを開く</a>
      </header>
      <div id="question-list" class="question-list"></div>
    </article>
  </main>
  <template id="question-template">
    <section class="question-card">
      <div class="question-meta">
        <span class="question-number"></span>
        <span class="source-label"></span>
      </div>
      <p class="question-prompt"></p>
      <label class="answer-field">自分の答え
        <textarea rows="3" placeholder="考えた式や答えを入力"></textarea>
      </label>
      <details>
        <summary>答え・解説を確認</summary>
        <div class="solution">
          <h2>答え</h2>
          <p class="answer"></p>
          <h2>解説</h2>
          <p class="explanation"></p>
          <a class="source-link" hidden target="_blank" rel="noopener noreferrer">出典情報を確認</a>
        </div>
      </details>
    </section>
  </template>
  <script src="generated-quiz.js?v=1" defer></script>
</body>
</html>
