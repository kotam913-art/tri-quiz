<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>指数・対数 | 5分クイズ</title><link rel="stylesheet" href="style.css?v=1"></head><body><header><a href="../index.html">← 単元を選ぶ</a><p class="eyebrow">EXPONENTIAL &amp; LOGARITHMIC FUNCTIONS</p><h1>指数・対数</h1><p>1回5分。小さなステップで、計算から方程式へ。</p></header><main><p>各クイズは3〜6問。自動採点と解説で確認し、満点になるまで何度でも挑戦できます。</p><p class="note">プリントの学習順：元の1〜3ページ → 16・17ページ → 4〜15ページ。ページ表記は元PDFの順番です。</p><div id="catalog"></div></main><footer>高校数学 · 指数・対数</footer><script src="data.js?v=1"></script><script>const root=document.querySelector('#catalog');for(const group of ['指数','対数','常用対数']){const h=document.createElement('h2');h.className='section-title';h.textContent=group;root.append(h);const grid=document.createElement('div');grid.className='grid';for(const task of EXPLOG_DATA.filter(x=>x.group===group)){const a=document.createElement('a');a.className='card';a.href='quiz.html?id='+task.id;let done=false;try{done=localStorage.getItem('explog-practice:'+task.id)==='perfect'}catch(e){}a.innerHTML='<span class="num">'+task.id.slice(-2)+'</span>'+(done?'<span class="status-pill">この端末で満点</span>':'')+'<h3>'+task.title+'</h3><p class="meta">元PDF '+task.sourcePages.join('・')+'ページ</p><span class="tag">5分</span> <span class="tag">'+task.questions.length+'問</span><p>挑戦する →</p>';grid.append(a)}root.append(grid)}</script></body></html>
